<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hẻm 47: Xứ Lạ</title>
<meta name="description" content="Hẻm 47 · Phần 2: Xứ Lạ. Bên kia sông, có người vẫn đang gõ.">
<meta name="theme-color" content="#05060a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;1,400&family=Oswald:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: một sân khấu phim 16:9, HUD nổi trên tranh, hộp thoại đè đáy tranh ở màn rộng, nằm dưới tranh ở điện thoại. Vào trại thì có khung đen trên dưới. */
:root{--ink:#10131c;--panel:#181c28;--panel2:#20263a;--line:#2e3549;--paper:#efe8d8;--dim:#959cb2;--amber:#f0b25c;--za:#4b8fe6;--red:#e2645c;--ok:#5fb37a;
--f-head:"Oswald","Arial Narrow",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;--f-body:"Be Vietnam Pro",system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#05060a;color:var(--paper);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
#app{max-width:1120px;margin:0 auto;padding:10px 16px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.top h1{margin:0;font-family:var(--f-head);font-weight:600;text-transform:uppercase;font-size:24px;color:var(--amber);letter-spacing:.03em}
.top h1 small{color:var(--dim);font-size:13px;letter-spacing:.2em;margin-left:8px}
.ibtn{font:inherit;font-size:13px;background:var(--panel2);color:var(--paper);border:1px solid var(--line);padding:6px 12px;border-radius:18px;cursor:pointer}
#stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none}
#bg,#bg2{position:absolute;inset:0;background:#0b0d14 center/cover no-repeat;transition:opacity .9s ease,filter 1.2s ease}
#bg2{opacity:0}
#stage.trai #bg,#stage.trai #bg2{filter:saturate(.55) contrast(1.05) brightness(.92)}
#stage.toi #bg,#stage.toi #bg2{filter:brightness(.45) saturate(.6)}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:8;transition:height .9s ease;pointer-events:none}
.lb.t{top:0}.lb.b{bottom:0}
#stage.cine .lb{height:9%}
#chars{position:absolute;inset:0;pointer-events:none;z-index:2}
#chars img{position:absolute;bottom:0;height:88%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6));transition:opacity .4s}
.hud{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;z-index:9}
#stage.cine .hud{top:calc(9% + 6px)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.chip{background:rgba(16,19,28,.82);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:3px 10px;font-size:12.5px;white-space:nowrap}
.chip b{color:var(--amber);font-weight:600}
.chip.red b{color:var(--red)}
.bar{width:120px;height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d9a24a,#e2645c);width:0;transition:width .6s}
.meter{background:rgba(16,19,28,.82);border-radius:10px;padding:4px 10px;font-size:11.5px;color:var(--dim)}
/* hộp thoại */
#dlg{position:absolute;left:3%;right:3%;bottom:4%;display:flex;gap:14px;align-items:flex-start;background:rgba(16,19,28,.94);border:1px solid rgba(240,178,92,.3);border-radius:12px;padding:12px 16px;min-height:92px;z-index:10;cursor:pointer}
#stage.cine #dlg{bottom:calc(9% + 8px)}
#dlg img{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none;background:#222}
#dlg .tx{min-width:0;flex:1}
#dlg .who{font-family:var(--f-head);font-size:15px;letter-spacing:.04em;color:var(--amber);margin-bottom:3px;text-transform:uppercase}
#dlg .ln{font-size:16px;line-height:1.55;white-space:pre-wrap}
#dlg.mota .ln{font-style:italic;color:#d9d3c4}
#dlg.nghi .ln{color:#b9c6e6}
#dlg .more{position:absolute;right:12px;bottom:6px;color:var(--dim);font-size:12px}
#ch{position:absolute;left:3%;right:3%;bottom:4%;z-index:11;display:flex;flex-direction:column;gap:8px;background:rgba(16,19,28,.95);border:1px solid var(--line);border-radius:12px;padding:12px}
#stage.cine #ch{bottom:calc(9% + 8px)}
#ch .q{font-size:13px;color:var(--dim)}
#ch button{font:inherit;text-align:left;background:var(--panel2);color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;line-height:1.35}
#ch button:hover,#ch button:focus-visible{border-color:var(--amber);outline:none}
#ch button:disabled{opacity:.45;cursor:default}
#ch button small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.timer{height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--red);width:100%}
/* thẻ cảnh đánh máy */
#card{position:absolute;inset:0;background:#05060a;z-index:20;display:grid;place-items:center;padding:24px;cursor:pointer}
#card .in{max-width:640px;width:100%;font-family:var(--f-mono);color:#e8e2d2;font-size:clamp(13px,2.6vw,20px);line-height:1.7;white-space:pre-wrap}
#card .in .k{color:var(--amber)}
.cur::after{content:"▍";animation:bl 1s steps(1) infinite;color:var(--amber);margin-left:2px}
@keyframes bl{50%{opacity:0}}
/* bảng việc */
#panel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
#panel h3{margin:0 0 8px;font-family:var(--f-head);font-weight:500;letter-spacing:.04em;font-size:16px;color:var(--amber);text-transform:uppercase}
#panel .goal{font-size:13px;color:var(--dim);margin:0 0 10px}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.task{font:inherit;text-align:left;background:var(--panel2);color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;min-width:0}
.task img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:#222}
.task span{min-width:0}
.task b{display:block;font-weight:600;font-size:14px}
.task small{color:var(--dim);font-size:12px}
.task.chinh{border-color:rgba(240,178,92,.6)}
.task.chinh b::before{content:"● ";color:var(--amber)}
.task:hover,.task:focus-visible{border-color:var(--amber);outline:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font-family:var(--f-head);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:16px;background:var(--amber);color:#21170a;border:0;padding:7px 20px;border-radius:22px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
/* lớp trò chơi phủ lên sân khấu */
#ov{position:absolute;inset:0;z-index:15;background:#05060a;display:flex;flex-direction:column;overflow:hidden}
#stage.cine #ov{top:9%;bottom:9%}
.ovh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--dim);flex:none}
.ovh b{color:var(--paper);font-family:var(--f-head);font-weight:500;letter-spacing:.04em;font-size:15px}
.ovb{flex:1;min-height:0;overflow:auto;padding:10px 12px}
/* khung chat ca nhắn tin */
.chat{display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto}
.msg{max-width:82%;padding:7px 11px;border-radius:14px;font-size:14px;line-height:1.4}
.msg.k{background:#2a2f40;align-self:flex-start;border-bottom-left-radius:4px}
.msg.m{background:var(--za);align-self:flex-end;border-bottom-right-radius:4px;color:#fff}
.msg.sys{align-self:center;background:none;color:var(--dim);font-size:12px;font-style:italic}
.opts{display:flex;flex-direction:column;gap:6px;max-width:520px;margin:10px auto 0}
.opt{font-size:14px;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--paper);border-radius:10px;padding:8px 10px;line-height:1.45}
.opt .btn{font-size:13px;padding:4px 14px}
.opt .w{border-bottom:1px dashed var(--amber);color:var(--amber);cursor:pointer;padding:0 1px}
.opt .w.loi{color:var(--red);border-color:var(--red);text-decoration:line-through wavy}
.opt.chon{border-color:var(--amber)}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
/* tin giấu chữ */
.gc textarea{width:100%;min-height:130px;font:inherit;font-size:15px;line-height:1.6;background:#0f121b;color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}
.gc .acr{font-family:var(--f-mono);font-size:22px;letter-spacing:.3em;margin:8px 0}
.gc .acr .ok{color:var(--ok)}.gc .acr .no{color:var(--red)}.gc .acr .need{color:var(--dim)}
.gc ul{margin:6px 0;padding-left:18px;font-size:13px;color:var(--dim)}
.gc li.bad{color:var(--red)}
.frag{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.frag button{font:inherit;font-size:13px;background:var(--panel2);color:var(--paper);border:1px solid var(--line);border-radius:14px;padding:5px 10px;cursor:pointer}
.frag button b{color:var(--amber)}
/* đi đêm */
.dd{display:flex;flex-direction:column;height:100%}
.dd canvas{width:100%;flex:1;min-height:0;display:block;background:#06070b;touch-action:none}
.ctl{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;flex:none}
.ctl .g{display:flex;gap:6px}
.ctl button{font:inherit;font-size:15px;min-width:46px;height:42px;background:var(--panel2);color:var(--paper);border:1px solid var(--line);border-radius:10px;cursor:pointer;padding:0 10px}
.ctl button.on{border-color:var(--amber);color:var(--amber)}
.ctl button:disabled{opacity:.35}
/* màn đầu */
#home{position:fixed;inset:0;background:#05060a;z-index:50;overflow:auto}
#home .hin{max-width:720px;margin:0 auto;padding:40px 20px}
#home .k{font-size:13px;letter-spacing:.4em;color:#9aa3bd}
#home h2{font-family:var(--f-head);font-weight:600;font-size:clamp(48px,12vw,88px);margin:6px 0 4px;color:var(--amber);text-transform:uppercase;letter-spacing:.02em}
#home p{color:#cfc8b8;line-height:1.6}
#home .warn{font-size:13px;color:var(--dim);border-left:3px solid var(--red);padding-left:12px;margin:20px 0}
#home .save{font-family:var(--f-mono);font-size:13px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:16px 0}
#home select{font:inherit;background:var(--panel2);color:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px}
.foot{margin-top:28px;font-size:12px;color:#6c7389}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--amber);color:var(--paper);padding:8px 14px;border-radius:18px;z-index:70;font-size:13px;max-width:90vw}
#endc{position:fixed;inset:0;z-index:60;background:#05060a;overflow:auto}
#endc .in{max-width:720px;margin:0 auto;padding:40px 20px}
#endc p.l{font-family:var(--f-mono);font-size:clamp(14px,3.2vw,20px);line-height:1.65;color:#e8e2d2;margin:0 0 14px}
#endc h2{font-family:var(--f-head);color:var(--amber);font-size:34px;margin:28px 0 8px;text-transform:uppercase}
#endc .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0}
#endc .sum div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
#endc .sum b{display:block;font-size:22px;color:var(--amber)}
#endc .sum span{font-size:12px;color:var(--dim)}
#endc ol{color:#cfc8b8;font-size:14px;line-height:1.6}
@media (max-width:700px){
  #app{padding:6px 0 20px}
  .top{padding:0 10px}
  #stage{border-radius:0}
  #dlg,#ch{position:static;margin:8px 10px 0;min-height:0}
  #stage.cine #dlg,#stage.cine #ch{bottom:auto}
  #dlg img{width:56px;height:56px}
  #dlg .ln{font-size:15px}
  #panel{margin:10px 10px 0}
  #stage.has-ov{aspect-ratio:auto;height:min(78vh,620px)}
  .hud .meter{display:none}
}
</style></head><body>
<div id="app">
  <div class="top"><h1>Xứ Lạ <small>HẺM 47 · PHẦN 2</small></h1><div><button class="ibtn" id="bSave" type="button">Lưu</button> <button class="ibtn" id="bMenu" type="button">Menu</button></div></div>
  <div id="stage">
    <div id="bg"></div><div id="bg2"></div>
    <div id="chars"></div>
    <div class="lb t"></div><div class="lb b"></div>
    <div class="hud"><div class="chips" id="chips"></div><div id="meters"></div></div>
    <div id="ov" hidden></div>
    <div id="card" hidden><div class="in" id="cardIn"></div></div>
  </div>
  <div id="dlgWrap"></div>
  <div id="panel" hidden></div>
</div>
<div id="home"></div>
<div id="endc" hidden></div>
<script src="xula/engine.js"></script>
<script src="xula/games.js"></script>
<script src="xula/story.js"></script>
<script src="xula/days.js"></script>
<script>boot();</script>
</body></html>
